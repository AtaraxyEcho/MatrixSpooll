server {
    listen 8080;
    server_name _;
    server_tokens off;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /docs {
        return 308 /docs/;
    }

    location /docs/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /docs/index.html;
    }

    location / {
        return 404;
    }
}
