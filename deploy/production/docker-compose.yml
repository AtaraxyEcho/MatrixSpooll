services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: matrixspooll
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
      POSTGRES_DB: matrixspooll
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./pgdata:/var/lib/postgresql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matrixspooll -d matrixspooll"]
      interval: 10s
      timeout: 5s
      retries: 5

  matrixspooll:
    build:
      context: ../../
      dockerfile: Dockerfile
    # 构建版使用仓库根目录 Dockerfile，镜像内包含 ffmpeg 和 ffprobe。
    ports:
      - "1241:1241"
    env_file: .env
    environment:
      # 数据库连接串
      DATABASE_URL: postgresql+asyncpg://matrixspooll:${POSTGRES_PASSWORD}@postgres:5432/matrixspooll
      TZ: ${TZ:-Asia/Shanghai}
    # Agent Bash 沙箱 (bwrap) 所需权限
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
    cap_add:
      - NET_ADMIN
    volumes:
      # 持久化运行时数据（不再挂载 .venv 和 uv_cache，因为依赖已固化在镜像中）
      - ./.env:/app/.env
      - ./projects:/app/projects
      - ./logs:/app/logs
      - ./vertex_keys:/app/vertex_keys
      - ./claude_data:/root/.claude
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:1241/health/ready && ffmpeg -version >/dev/null 2>&1 && ffprobe -version >/dev/null 2>&1"]
      interval: 30s
      timeout: 5s
      retries: 3
