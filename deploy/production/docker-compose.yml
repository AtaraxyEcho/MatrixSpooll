name: matrixspooll-production

x-json-logging: &json-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  source-release:
    image: python:3.12-slim
    command:
      - python
      - scripts/build_source_release.py
      - --project-root
      - /source
      - --output-dir
      - /output
      - --version
      - ${MATRIXSPOOLL_VERSION:-1.2.0}
    working_dir: /source
    volumes:
      - ../../:/source:ro
      - ./legal-source:/output
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"
    logging: *json-logging

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: matrixspooll
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/production/.env}
      POSTGRES_DB: matrixspooll
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./pgdata:/var/lib/postgresql
    networks:
      - database
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *json-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matrixspooll -d matrixspooll"]
      interval: 10s
      timeout: 5s
      retries: 5

  matrixspooll:
    build:
      context: ../../
      dockerfile: Dockerfile
      args:
        MATRIXSPOOLL_VERSION: ${MATRIXSPOOLL_VERSION:-1.2.0}
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-https://deb.debian.org}
    env_file: .env
    environment:
      AUTH_ENABLED: "true"
      AUTH_USERNAME: ${AUTH_USERNAME:-admin}
      AUTH_PASSWORD: ${AUTH_PASSWORD:?Set AUTH_PASSWORD in deploy/production/.env}
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:?Set AUTH_TOKEN_SECRET in deploy/production/.env}
      CORS_ORIGINS: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN in deploy/production/.env}
      DATABASE_URL: postgresql+asyncpg://matrixspooll:${POSTGRES_PASSWORD}@postgres:5432/matrixspooll
      MATRIXSPOOLL_SOURCE_RELEASE_DIR: /app/legal-source
      MATRIXSPOOLL_SOURCE_DOWNLOAD_ENABLED: ${MATRIXSPOOLL_SOURCE_DOWNLOAD_ENABLED:-true}
      TZ: ${TZ:-Asia/Shanghai}
    command:
      - /app/.venv/bin/uvicorn
      - server.app:app
      - --host
      - 0.0.0.0
      - --port
      - "1241"
      - --loop
      - server.event_loop:subprocess_capable_event_loop_factory
      - --proxy-headers
      - --forwarded-allow-ips
      - "*"
    expose:
      - "1241"
    networks:
      - edge
      - database
    # The Agent bwrap sandbox needs unprivileged namespaces and NET_ADMIN for
    # its isolated loopback interface. Port 1241 is not published to the host.
    security_opt:
      - no-new-privileges:true
      - seccomp:unconfined
      - apparmor:unconfined
    cap_add:
      - NET_ADMIN
    volumes:
      - ./projects:/app/projects
      - ./logs:/app/logs
      - ./vertex_keys:/app/vertex_keys
      - ./claude_data:/root/.claude
      - ./legal-source:/app/legal-source:ro
    depends_on:
      source-release:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    init: true
    restart: unless-stopped
    stop_grace_period: 60s
    logging: *json-logging
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:1241/health/ready && ffmpeg -version >/dev/null 2>&1 && ffprobe -version >/dev/null 2>&1"]
      interval: 30s
      timeout: 5s
      retries: 3

  docs:
    build:
      context: ../../
      dockerfile: website/Dockerfile
      args:
        DOCS_SITE_URL: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN in deploy/production/.env}
        DOCS_BASE_URL: /docs/
    expose:
      - "8080"
    networks:
      - edge
    read_only: true
    tmpfs:
      - /tmp:size=32m,uid=101,gid=101,mode=1777
      - /var/cache/nginx:size=16m,uid=101,gid=101,mode=0755
      - /var/log/nginx:size=16m,uid=101,gid=101,mode=0755
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    restart: unless-stopped
    stop_grace_period: 15s
    logging: *json-logging
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/health >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 6

  nginx:
    image: nginxinc/nginx-unprivileged:1.30.4-alpine
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?Set PUBLIC_HOST in deploy/production/.env}
    entrypoint: ["/bin/sh", "/opt/matrixspooll/nginx-entrypoint.sh"]
    ports:
      - "80:8080"
      - "443:8443"
    volumes:
      - ./nginx/nginx-entrypoint.sh:/opt/matrixspooll/nginx-entrypoint.sh:ro
      - ./nginx/bootstrap.conf.template:/opt/matrixspooll/bootstrap.conf.template:ro
      - ./nginx/https.conf.template:/opt/matrixspooll/https.conf.template:ro
      - certbot_webroot:/var/www/certbot:ro
      - nginx_tls:/etc/nginx/tls:ro
    networks:
      - edge
    read_only: true
    tmpfs:
      - /etc/nginx/conf.d:size=1m,uid=101,gid=101,mode=0755
      - /var/log/nginx:size=16m,uid=101,gid=101,mode=0755
      - /tmp:size=32m,uid=101,gid=101,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      matrixspooll:
        condition: service_started
      docs:
        condition: service_healthy
    init: true
    restart: unless-stopped
    stop_grace_period: 15s
    logging: *json-logging
    healthcheck:
      test: ["CMD-SHELL", "wget --header=Host:${PUBLIC_HOST} -q -O - http://127.0.0.1:8080/nginx-health >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 6

  certbot:
    image: certbot/certbot:v5.7.0
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?Set PUBLIC_HOST in deploy/production/.env}
      CERTBOT_EMAIL: ${CERTBOT_EMAIL:?Set CERTBOT_EMAIL in deploy/production/.env}
    entrypoint: ["/bin/sh", "/opt/matrixspooll/certbot-loop.sh"]
    volumes:
      - ./certbot/certbot-loop.sh:/opt/matrixspooll/certbot-loop.sh:ro
      - certbot_webroot:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
      - nginx_tls:/etc/nginx/tls
    networks:
      - edge
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /var/lib/letsencrypt:size=32m,mode=0700
      - /var/log/letsencrypt:size=32m,mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      nginx:
        condition: service_healthy
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *json-logging

networks:
  edge:
  database:
    internal: true

volumes:
  certbot_webroot:
  letsencrypt:
  nginx_tls:
